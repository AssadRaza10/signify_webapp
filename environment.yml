# Conda environment configuration for Signify project
# Usage: `conda env create -f environment.yml` then `conda activate signify-env`
# Notes:
# - This file installs core scientific packages via conda and project-specific
#   packages via pip to avoid binary conflicts on Windows.
# - Adjust `python=` or package versions if you need a specific TensorFlow/GPU
#   build. For GPU support follow TensorFlow's official install guide.

name: signify-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - joblib
  - ffmpeg          # useful for handling audio files
  - opencv          # conda-forge opencv binary (preferred on Windows)
  - pip:
    - Flask==2.3.3
    - Flask-Cors==3.0.10
    - opencv-python  # kept for compatibility; conda opencv will satisfy most needs
    - mediapipe
    - tensorflow
    - gTTS
    - python-Levenshtein
    - google-genai
    - scikit-learn
    - matplotlib
    - werkzeug
    - typing_extensions

# Optional tips:
# - If you want GPU support for TensorFlow, do not install `tensorflow` from
#   pip here. Instead follow TensorFlow's GPU install instructions and replace
#   the pip entry with the appropriate tensorflow package for your CUDA/cuDNN
#   setup (or install via conda-forge if available for your platform).
# - If you experience Mediapipe build issues on Windows, consider using the
#   prebuilt wheel for your Python version or consult the Mediapipe docs.
# - To create the environment and install packages run:
#     conda env create -f environment.yml
#   then activate it:
#     conda activate signify-env
# - To update the environment after editing this file:
#     conda env update -f environment.yml --prune
